name: Remove exposed PALASH AI backup artifact
on:
  push:
    paths:
      - ".github/workflows/remove-exposed-backup-artifact.yml"
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the backup artifact uploaded before public-repository guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/15108419018"
