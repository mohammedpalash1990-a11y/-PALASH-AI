              const execMatch=path.match(/^\/api\/tasks\/([^/]+)\/execute$/);if(execMatch&&request.method==="POST"){const s=await readWorkspaceState(),t=(s.tasks||[]).find(x=>x.id===execMatch[1]);if(!t)return json({error:"Task not found"},404);if(s.system?.emergencyStop)return json({error:"Emergency Stop is active"},423);if(t.status==="awaiting_approval")return json({error:"Owner approval is required before execution"},409);const start=Date.now();t.status="running";t.currentStage="Agent is processing";t.updatedAt=new Date().toISOString();await writeWorkspaceState(s);try{const output=await geminiText("You are PALASH AI agent "+t.assignedAgentId+". Provide the task result and concrete next steps. Do not claim external actions or code changes were made. Task: "+t.title+"\n"+t.description+"\nProject: "+t.projectId);const fresh=await readWorkspaceState(),target=fresh.tasks.find(x=>x.id===t.id);target.status="completed";target.progressPercent=100;target.currentStage="AI response completed";target.outputReport=output;target.errorMessage=null;target.attempts=(target.attempts||0)+1;target.durationMs=Date.now()-start;target.updatedAt=new Date().toISOString();const ag=(fresh.agents||[]).find(x=>x.id===target.assignedAgentId);if(ag){ag.completedTasks=(ag.completedTasks||0)+1;ag.lastActiveAt=target.updatedAt;}auditState(fresh,identity.email,"TASK_EXECUTED",target.id,"success","Gemini task response generated");await writeWorkspaceState(fresh);return json({task:target});}catch(e){const fresh=await readWorkspaceState(),target=fresh.tasks.find(x=>x.id===t.id);if(target){target.status="failed";target.errorMessage=e.message;target.currentStage="Execution failed";target.updatedAt=new Date().toISOString();target.attempts=(target.attempts||0)+1;auditState(fresh,identity.email,"TASK_EXECUTION_FAILED",target.id,"error",e.message);await writeWorkspaceState(fresh);}return json({error:e.message},502);}}
