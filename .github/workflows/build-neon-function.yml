                const s=await readWorkspaceState(), tasks=s.tasks||[], approvals=s.approvals||[], projects=s.projects||[], ledger=s.ledger_entries||[], targets=s.budget_targets||[];
                const revenue=ledger.filter(x=>x.type==="revenue").reduce((n,x)=>n+Number(x.amount||0),0);
                const expenses=ledger.filter(x=>["expense","staff_cost","inventory"].includes(x.type)).reduce((n,x)=>n+Number(x.amount||0),0);
                const staff=ledger.filter(x=>x.type==="staff_cost").reduce((n,x)=>n+Number(x.amount||0),0), inventory=ledger.filter(x=>x.type==="inventory").reduce((n,x)=>n+Number(x.amount||0),0);
                const budget=targets.reduce((n,x)=>n+Number(x.monthlyBudget||0),0), goal=targets.reduce((n,x)=>n+Number(x.revenueTarget||0),0);
                const financeSummary={totalRevenue:revenue,totalExpenses:expenses,operatingExpenses:expenses-staff-inventory,staffCosts:staff,inventorySpend:inventory,netProfit:revenue-expenses,profitMarginPct:revenue?(revenue-expenses)/revenue*100:0,staffCostRatioPct:revenue?staff/revenue*100:0,budgetUtilizationPct:budget?expenses/budget*100:0,monthlyBudget:budget,revenueTarget:goal,revenueAttainmentPct:goal?revenue/goal*100:0,cashFlowProjection30d:revenue-expenses,categoryBreakdown:ledger.map(x=>({category:x.category,amount:Number(x.amount||0),type:x.type}))};
                return json({projectsCount:projects.length,agentsCount:(s.agents||[]).length,tasks:{total:tasks.length,queued:tasks.filter(x=>x.status==="queued").length,running:tasks.filter(x=>x.status==="running").length,awaitingApproval:tasks.filter(x=>x.status==="awaiting_approval").length,completed:tasks.filter(x=>x.status==="completed").length,failed:tasks.filter(x=>x.status==="failed").length},pendingApprovalsCount:approvals.filter(x=>x.status==="pending").length,emergencyStop:Boolean(s.system?.emergencyStop),emergencyStopReason:s.system?.emergencyStopReason||null,financeSummary,recentTasks:tasks.slice(0,8),recentApprovals:approvals.slice(0,8),recentAudit:(s.audit_logs||[]).slice(0,8),projects});
              }'''
          body=body[:start]+overview+body[end:]
          replacements=[
            ('if (path === "/api/agents") return json((await pool.query("SELECT id,name,role,description,status FROM agents ORDER BY id")).rows);','if (path === "/api/agents") { const s=await readWorkspaceState(); return json({agents:s.agents||[],policies:[]}); }'),
            ('if (path === "/api/activity" || path === "/api/audit-logs") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 100")).rows);','if (path === "/api/activity" || path === "/api/audit-logs") { const s=await readWorkspaceState(); return json({logs:s.audit_logs||[]}); }'),
            ('if (path === "/api/memory") return json([]);','if (path === "/api/memory") { const s=await readWorkspaceState(); return json({memories:s.agent_memory||[]}); }'),
            ('if (path === "/api/projects" && request.method === "GET") return json((await pool.query("SELECT * FROM projects ORDER BY id DESC")).rows);','if (path === "/api/projects" && request.method === "GET") { const s=await readWorkspaceState(); return json({projects:s.projects||[]}); }'),
