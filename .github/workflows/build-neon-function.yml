name: Build PALASH AI Neon Function
on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/palashai-function-v2.zip.b64"
      - "package.json"
      - ".github/workflows/build-neon-function.yml"
permissions:
  contents: write
concurrency:
  group: palash-ai-neon-function-deploy
  cancel-in-progress: false
jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run automated security and core tests
        run: npm test
      - name: TypeScript validation (including Cloudflare Pages bindings)
        run: npm run lint
      - name: Build production web application
        run: npm run build
      - name: Extract source and bundle dependencies
        run: |
          base64 --decode deploy/palashai-function-v2.zip.b64 > source.zip
          mkdir source
          unzip -q source.zip -d source
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @neon/functions
          npx esbuild source/index.mjs --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=dist/index.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/index.mjs")
          s = p.read_text()
          def sub(old, new, label):
              global s
              if old not in s:
                  raise SystemExit("Missing function patch target: " + label)
              s = s.replace(old, new, 1)
          sub('var JWT_SECRET = process.env.JWT_SECRET;', 'var JWT_SECRET = process.env.JWT_SECRET || "";', 'JWT secret')
          sub('if (!process.env.DATABASE_URL || !ADMIN_PASSWORD || !JWT_SECRET) throw new Error("Required environment is missing");', 'if (!process.env.DATABASE_URL) throw new Error("DATABASE_URL is missing");', 'environment guard')
          sub('''  const hash = makeHash(ADMIN_PASSWORD);
            await pool.query(`INSERT INTO users(email,password_hash,role) VALUES($1,$2,'owner') ON CONFLICT(email) DO NOTHING`, [ADMIN_EMAIL, hash]);''', '''  if (!JWT_SECRET) {
              const secretRow = await pool.query("SELECT value FROM agent_settings WHERE key='jwt_secret'");
              if (secretRow.rowCount) JWT_SECRET = String(secretRow.rows[0].value);
              else {
                JWT_SECRET = randomBytes(48).toString("base64url");
                await pool.query("INSERT INTO agent_settings(key,value) VALUES('jwt_secret',$1::jsonb) ON CONFLICT(key) DO NOTHING", [JSON.stringify(JWT_SECRET)]);
              }
            }
            if (ADMIN_PASSWORD) {
              const hash = makeHash(ADMIN_PASSWORD);
              await pool.query(`INSERT INTO users(email,password_hash,role) VALUES($1,$2,'owner') ON CONFLICT(email) DO NOTHING`, [ADMIN_EMAIL, hash]);
            }''', 'persist JWT and optional environment owner')
          sub('if (path === "/api/health") return json({ ok: true, service: "PALASH AI", database: "connected" });', 'if (path === "/api/health") {\n      const owner = await pool.query("SELECT count(*)::int AS count FROM users WHERE role=\'owner\'");\n      return json({ status: "healthy", service: "PALASH AI", timestamp: new Date().toISOString(), database: { localStoreInitialized: true, tablesCount: 8, postgres: { configured: true, connected: true, database: "palash_ai", version: "PostgreSQL", latencyMs: null, error: null }, persistentStore: { mode: "neon-postgresql", connected: true } }, agentsCount: (await readWorkspaceState()).agents?.length || 0, ownerAccountReady: owner.rows[0].count > 0, geminiConfigured: Boolean(process.env.GEMINI_API_KEY), githubTokenConfigured: Boolean(process.env.GITHUB_TOKEN), emergencyStop: Boolean((await readWorkspaceState()).system?.emergencyStop) });\n    }', 'health')
          sub('if (path === "/api/login" && request.method === "POST") {', 'if (path === "/api/auth/status") {\n      const owner = await pool.query("SELECT count(*)::int AS count FROM users WHERE role=\'owner\'");\n      return json({ needsSetup: owner.rows[0].count === 0, envAdminConfigured: Boolean(ADMIN_PASSWORD), suggestedEmail: "mohammedpalash1990@gmail.com" });\n    }\n    if (path === "/api/auth/setup" && request.method === "POST") {\n      const b = await request.json();\n      const email = String(b.email || "").trim().toLowerCase();\n      const password = String(b.password || "");\n      const name = String(b.name || "Palash Owner").trim().slice(0, 120) || "Palash Owner";\n      if (!email.includes("@") || password.length < 8) return json({ error: "A valid email and password of at least 8 characters are required." }, 400);\n      const owner = await pool.query("SELECT count(*)::int AS count FROM users WHERE role=\'owner\'");\n      if (owner.rows[0].count > 0) return json({ error: "Owner account is already configured. Please sign in." }, 409);\n      const q = await pool.query("INSERT INTO users(email,password_hash,role) VALUES($1,$2,\'owner\') RETURNING id,email,role", [email, makeHash(password)]);\n      await pool.query("INSERT INTO activity_logs(actor,action) VALUES($1,$2)", [email, "Owner account initialized"]);\n      const user = q.rows[0];\n      return json({ token: token(user), user: { id: String(user.id), email: user.email, name, role: user.role } }, 201);\n    }\n    if (path === "/api/auth/logout" && request.method === "POST") return json({ ok: true });\n    if ((path === "/api/login" || path === "/api/auth/login") && request.method === "POST") {', 'auth routes')
          sub('if (String(b.email || "").toLowerCase() !== ADMIN_EMAIL || String(b.password || "").length < 1) return json({ error: "Invalid credentials" }, 401);', 'const email = String(b.email || "").trim().toLowerCase();\n      const password = String(b.password || "");', 'login input')
          sub('const q = await pool.query("SELECT id,email,password_hash,role FROM users WHERE email=$1", [ADMIN_EMAIL]);', 'const q = await pool.query("SELECT id,email,password_hash,role FROM users WHERE email=$1 AND role=\'owner\'", [email]);', 'login query')
          sub('if (!q.rowCount || !verifyHash(String(b.password), q.rows[0].password_hash)) return json({ error: "Invalid credentials" }, 401);', 'if (!email || !password || !q.rowCount || !verifyHash(password, q.rows[0].password_hash)) return json({ error: "Invalid credentials" }, 401);', 'login verify')
          sub('await pool.query("INSERT INTO activity_logs(actor,action) VALUES($1,$2)", [ADMIN_EMAIL, "Signed in"]);', 'await pool.query("INSERT INTO activity_logs(actor,action) VALUES($1,$2)", [email, "Signed in"]);', 'login activity')
          sub('return json({ token: token(q.rows[0]) });', 'const user = q.rows[0];\n      return json({ token: token(user), user: { id: String(user.id), email: user.email, name: "Palash Owner", role: user.role } });', 'login response')
          sub('if (path === "/api/me") return json({ email: identity.email, role: identity.role });', 'if (path === "/api/me") return json({ id: identity.sub, email: identity.email, name: "Palash Owner", role: identity.role });', 'identity response')
          sub('if (path === "/api/activity") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 20")).rows);', 'if (path === "/api/activity" || path === "/api/audit-logs") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 100")).rows);\n            if (path === "/api/memory") return json([]);', 'audit and memory routes')
          sub('const approvalMatch = path.match(/^\\/api\\/approvals\\/(\\d+)$/);', 'const approvalMatch = path.match(/^\\/api\\/approvals\\/(\\d+)(?:\\/decide)?$/);', 'approval route alias')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/index.mjs")
          s=p.read_text()
          s=s.replace('import { createHmac, timingSafeEqual, scryptSync, randomBytes } from "node:crypto";', 'import { createHmac, timingSafeEqual, scryptSync, randomBytes, createCipheriv, createDecipheriv, createHash } from "node:crypto";', 1)
          helper = r"""
          async function readWorkspaceState() {
            const r = await pool.query("SELECT state FROM palash_ai_state WHERE id=1");
            if (!r.rowCount) throw new Error("PALASH AI workspace state is not initialized");
            return r.rows[0].state;
          }
          async function writeWorkspaceState(state) {
            await pool.query("UPDATE palash_ai_state SET state=$1::jsonb, updated_at=now() WHERE id=1", [JSON.stringify(state)]);
          }
                    function canonicalJson(value) {
            if (Array.isArray(value)) return "[" + value.map(canonicalJson).join(",") + "]";
            if (value && typeof value === "object") return "{" + Object.keys(value).sort().map(key => JSON.stringify(key) + ":" + canonicalJson(value[key])).join(",") + "}";
            return JSON.stringify(value);
          }
          function backupChecksum(snapshot) {
            return createHmac("sha256", JWT_SECRET).update(canonicalJson(snapshot)).digest("hex");
          }
          function backupIntegrity(snapshot, checksum) {
            const canonical = backupChecksum(snapshot);
            const legacy = createHmac("sha256", JWT_SECRET).update(JSON.stringify(snapshot)).digest("hex");
            return canonical === checksum || legacy === checksum ? "verified" : "unverified";
          }
          """
          s=s.replace("var index_default = { async fetch(request) {", helper + "\nvar index_default = { async fetch(request) {", 1)
          start=s.index("var index_default =")
          head, body=s[:start], s[start:]
          start_text='if (path === "/api/overview") {'
          start=body.index(start_text)
          end=body.index("\n    }",start)+6
          overview=r'''if (path === "/api/overview") {
                const s=await readWorkspaceState(), tasks=s.tasks||[], approvals=s.approvals||[], projects=s.projects||[], ledger=s.ledger_entries||[], targets=s.budget_targets||[];
                const revenue=ledger.filter(x=>x.type==="revenue").reduce((n,x)=>n+Number(x.amount||0),0);
                const expenses=ledger.filter(x=>["expense","staff_cost","inventory"].includes(x.type)).reduce((n,x)=>n+Number(x.amount||0),0);
                const staff=ledger.filter(x=>x.type==="staff_cost").reduce((n,x)=>n+Number(x.amount||0),0), inventory=ledger.filter(x=>x.type==="inventory").reduce((n,x)=>n+Number(x.amount||0),0);
                const budget=targets.reduce((n,x)=>n+Number(x.monthlyBudget||0),0), goal=targets.reduce((n,x)=>n+Number(x.revenueTarget||0),0);
                const financeSummary={totalRevenue:revenue,totalExpenses:expenses,operatingExpenses:expenses-staff-inventory,staffCosts:staff,inventorySpend:inventory,netProfit:revenue-expenses,profitMarginPct:revenue?(revenue-expenses)/revenue*100:0,staffCostRatioPct:revenue?staff/revenue*100:0,budgetUtilizationPct:budget?expenses/budget*100:0,monthlyBudget:budget,revenueTarget:goal,revenueAttainmentPct:goal?revenue/goal*100:0,cashFlowProjection30d:revenue-expenses,categoryBreakdown:ledger.map(x=>({category:x.category,amount:Number(x.amount||0),type:x.type}))};
                return json({projectsCount:projects.length,agentsCount:(s.agents||[]).length,tasks:{total:tasks.length,queued:tasks.filter(x=>x.status==="queued").length,running:tasks.filter(x=>x.status==="running").length,awaitingApproval:tasks.filter(x=>x.status==="awaiting_approval").length,completed:tasks.filter(x=>x.status==="completed").length,failed:tasks.filter(x=>x.status==="failed").length},pendingApprovalsCount:approvals.filter(x=>x.status==="pending").length,emergencyStop:Boolean(s.system?.emergencyStop),emergencyStopReason:s.system?.emergencyStopReason||null,financeSummary,recentTasks:tasks.slice(0,8),recentApprovals:approvals.slice(0,8),recentAudit:(s.audit_logs||[]).slice(0,8),projects});
              }'''
          body=body[:start]+overview+body[end:]
          replacements=[
            ('if (path === "/api/agents") return json((await pool.query("SELECT id,name,role,description,status FROM agents ORDER BY id")).rows);','if (path === "/api/agents") { const s=await readWorkspaceState(); return json({agents:s.agents||[],policies:approvalPolicies()}); }'),
            ('if (path === "/api/activity" || path === "/api/audit-logs") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 100")).rows);','if (path === "/api/activity" || path === "/api/audit-logs") { const s=await readWorkspaceState(); return json({logs:s.audit_logs||[]}); }'),
            ('if (path === "/api/memory") return json([]);','if (path === "/api/memory") { const s=await readWorkspaceState(); return json({memories:s.agent_memory||[]}); }'),
            ('if (path === "/api/projects" && request.method === "GET") return json((await pool.query("SELECT * FROM projects ORDER BY id DESC")).rows);','if (path === "/api/projects" && request.method === "GET") { const s=await readWorkspaceState(); return json({projects:s.projects||[]}); }'),
            ('if (path === "/api/tasks" && request.method === "GET") return json((await pool.query("SELECT t.*,a.name agent_name FROM tasks t LEFT JOIN agents a ON a.id=t.agent_id ORDER BY t.id DESC LIMIT 200")).rows);','if (path === "/api/tasks" && request.method === "GET") { const s=await readWorkspaceState(); return json({tasks:s.tasks||[]}); }'),
            ('if (path === "/api/approvals") return json((await pool.query("SELECT * FROM approvals ORDER BY id DESC LIMIT 100")).rows);','if (path === "/api/approvals") { const s=await readWorkspaceState(); return json({approvals:s.approvals||[]}); }')
          ]
          for old,new in replacements:
            if old not in body: raise SystemExit("Missing route patch target: "+old[:70])
            body=body.replace(old,new,1)
          body=body.replace('if (path === "/api/tasks" && request.method === "POST") {','if (false && path === "/api/tasks" && request.method === "POST") {',1)
          body=body.replace('if (path === "/api/projects" && request.method === "POST") {','if (false && path === "/api/projects" && request.method === "POST") {',1)
          p.write_text(head+body)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/index.mjs")
          s=p.read_text()
          helpers = r"""
          function auditState(s, actor, action, resource, outcome, details) {
            s.audit_logs ||= [];
            s.audit_logs.unshift({id:"audit-"+Date.now(),actor,action,resource,outcome,ip:"",details,timestamp:new Date().toISOString()});
            s.audit_logs=s.audit_logs.slice(0,500);
          }
          function riskFor(action) {
            if (["database_deletion","production_deploy","payment_purchase","database_migration","database_restore"].includes(action)) return "critical";
            if (["external_message","social_media_publish"].includes(action)) return "high";
            if (["research","planning","code_analysis","test_execution"].includes(action)) return "low";
            return "medium";
          }
          function requiresOwnerApproval(action) {
            return ["branch_code_change","production_deploy","database_migration","database_restore","database_deletion","payment_purchase","external_message","social_media_publish"].includes(action);
          }
          function approvalRequirementFor(action) {
            if (action==="test_execution") return "auto_sandbox";
            if (action==="branch_code_change") return "restricted_branch";
            return requiresOwnerApproval(action) ? "mandatory" : "none";
          }
          function approvalPolicies() {
            return [
              ["research","General Research","none","low",false,"Information gathering and read-only exploration without external mutation."],
              ["planning","Task Planning","none","low",false,"Chief Agent decomposition, milestone structuring, and scheduling."],
              ["code_analysis","Code Analysis","none","low",false,"Static inspection, bug detection, and security auditing without modifying files."],
              ["test_execution","Test Execution","auto_sandbox","low",false,"Automated tests and build verification in an isolated environment."],
              ["branch_code_change","New Branch Code Changes","restricted_branch","medium",true,"Code edits on an isolated feature branch; requires scoped permission before merge."],
              ["production_deploy","Production Deployment","mandatory","critical",true,"Mandatory Owner approval before deploying to a live environment."],
              ["database_migration","Database Migration","mandatory","critical",true,"Mandatory Owner approval before altering schemas or executing migrations."],
              ["database_restore","Database Restore","mandatory","critical",true,"Mandatory Owner approval; a verified safety snapshot is created before restoring workspace state."],
              ["database_deletion","Database Deletion","mandatory","critical",true,"Mandatory Owner approval; databases cannot be dropped autonomously."],
              ["payment_purchase","Payment or Purchase","mandatory","critical",true,"Mandatory Owner approval before paid subscriptions or purchases."],
              ["external_message","WhatsApp / Email Dispatch","mandatory","high",true,"Mandatory Owner approval before external messages are sent."],
              ["social_media_publish","Social Media Publishing","mandatory","high",true,"Mandatory Owner approval before public publishing."]
            ].map(([actionType,label,requirement,riskLevel,requiresHumanApproval,description])=>({actionType,label,requirement,riskLevel,requiresHumanApproval,description}));
          }
          async function geminiText(prompt) {
            const key=process.env.GEMINI_API_KEY;
            if(!key) throw new Error("GEMINI_API_KEY is not configured");
            const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(process.env.GEMINI_MODEL || "gemini-3.8-flash")+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{temperature:0.2}})});
            const d=await r.json();
            if(!r.ok) throw new Error(d.error?.message||("Gemini request failed: "+r.status));
            return d.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("").trim()||"No AI response returned";
          }

          function githubEncryptionKey() { return createHmac("sha256", JWT_SECRET).update("palash-ai-github-token").digest(); }
          function encryptGithubToken(tokenValue) {
            const iv=randomBytes(12), cipher=createCipheriv("aes-256-gcm",githubEncryptionKey(),iv);
            const encrypted=Buffer.concat([cipher.update(tokenValue,"utf8"),cipher.final()]);
            return {iv:iv.toString("base64"),tag:cipher.getAuthTag().toString("base64"),data:encrypted.toString("base64")};
          }
          function decryptGithubToken(record) {
            const decipher=createDecipheriv("aes-256-gcm",githubEncryptionKey(),Buffer.from(record.iv,"base64"));
            decipher.setAuthTag(Buffer.from(record.tag,"base64"));
            return Buffer.concat([decipher.update(Buffer.from(record.data,"base64")),decipher.final()]).toString("utf8");
          }
          async function getGithubToken() {
            if(process.env.GITHUB_TOKEN) return process.env.GITHUB_TOKEN;
            const r=await pool.query("SELECT value FROM agent_settings WHERE key='github_session_token'");
            if(!r.rowCount) return null;
            const v=r.rows[0].value;
            try{return decryptGithubToken(typeof v==="string"?JSON.parse(v):v);}catch{return null;}
          }
          async function githubApi(path, tokenValue, init={}) {
            const r=await fetch("https://api.github.com"+path,{...init,headers:{accept:"application/vnd.github+json","x-github-api-version":"2022-11-28",authorization:"Bearer "+tokenValue,...(init.headers||{})}});
            const data=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(data.message||("GitHub API request failed: "+r.status));
            return {data,headers:r.headers};
          }
          function gitBlobSha(content) {
            return createHash("sha1").update("blob "+Buffer.byteLength(content)+"\0"+content).digest("hex");
          }
          function integrationEncryptionKey() { return createHmac("sha256",JWT_SECRET).update("palash-ai-integration-token-v1").digest(); }
          function encryptIntegrationConfig(value) {
            const iv=randomBytes(12),cipher=createCipheriv("aes-256-gcm",integrationEncryptionKey(),iv),encrypted=Buffer.concat([cipher.update(value,"utf8"),cipher.final()]);
            return {iv:iv.toString("base64"),tag:cipher.getAuthTag().toString("base64"),data:encrypted.toString("base64")};
          }
          function decryptIntegrationConfig(record) {
            const decipher=createDecipheriv("aes-256-gcm",integrationEncryptionKey(),Buffer.from(record.iv,"base64"));
            decipher.setAuthTag(Buffer.from(record.tag,"base64"));
            return Buffer.concat([decipher.update(Buffer.from(record.data,"base64")),decipher.final()]).toString("utf8");
          }
          async function getIntegrationConfig(provider) {
            const r=await pool.query("SELECT value FROM agent_settings WHERE key=$1",["integration_"+provider]);
            if(!r.rowCount)return null;
            const v=typeof r.rows[0].value==="string"?JSON.parse(r.rows[0].value):r.rows[0].value;
            try{return JSON.parse(decryptIntegrationConfig(v));}catch{return null;}
          }
          async function saveIntegrationConfig(provider,config) {
            const sealed=encryptIntegrationConfig(JSON.stringify(config));
            await pool.query("INSERT INTO agent_settings(key,value) VALUES($1,$2::jsonb) ON CONFLICT(key) DO UPDATE SET value=EXCLUDED.value,updated_at=now()",["integration_"+provider,JSON.stringify(sealed)]);
          }
          async function verifyIntegrationConfig(provider,config) {
            const tokenValue=String(config.accessToken||"");
            if(!tokenValue)throw new Error("Access token is required");
            let url;
            if(provider==="facebook_page")url="https://graph.facebook.com/v24.0/"+encodeURIComponent(config.pageId)+"?fields=id,name&access_token="+encodeURIComponent(tokenValue);
            else if(provider==="instagram_business")url="https://graph.facebook.com/v24.0/"+encodeURIComponent(config.instagramUserId)+"?fields=id,username&access_token="+encodeURIComponent(tokenValue);
            else if(provider==="linkedin")url="https://api.linkedin.com/v2/userinfo";
            else if(provider==="youtube")url="https://www.googleapis.com/youtube/v3/channels?part=id,snippet&mine=true";
            else if(provider==="whatsapp_business")url="https://graph.facebook.com/v24.0/"+encodeURIComponent(config.phoneNumberId)+"?fields=id,display_phone_number&access_token="+encodeURIComponent(tokenValue);
            else throw new Error("Unsupported integration provider");
            const r=await fetch(url,{headers:provider==="linkedin"?{authorization:"Bearer "+tokenValue}:{}});
            const d=await r.json().catch(()=>({}));
            if(!r.ok||d.error)throw new Error(d.error?.message||d.message||("Provider verification failed: "+r.status));
            if(provider==="linkedin")config.authorUrn=config.authorUrn||("urn:li:person:"+d.sub);
            if(provider==="youtube"){config.channelId=d.items?.[0]?.id||null;if(!config.channelId)throw new Error("No YouTube channel is available for this account");}
            return {accountName:d.name||d.username||d.display_phone_number||d.items?.[0]?.snippet?.title||config.authorUrn||config.channelId||"Connected account",accountId:d.id||d.sub||config.channelId||config.pageId||config.instagramUserId||config.phoneNumberId||null};
          }
          async function publishSocialApproval(approval) {
            const platform=String(approval.platform||"").toLowerCase();
            const provider=platform.includes("instagram")?"instagram_business":platform.includes("linkedin")?"linkedin":platform.includes("youtube")?"youtube":"facebook_page";
            const cfg=await getIntegrationConfig(provider);
            if(!cfg)throw new Error("Connect "+provider+" before approving a public post");
            const content=String(approval.payloadPreview||"").trim();
            if(!content)throw new Error("Post content is empty");
            if(provider==="facebook_page"){
              const body=new URLSearchParams({message:content,access_token:cfg.accessToken});
              const r=await fetch("https://graph.facebook.com/v24.0/"+encodeURIComponent(cfg.pageId)+"/feed",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body});
              const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error?.message||("Facebook publish failed: "+r.status));
              return {provider,postId:d.id,url:null};
            }
            if(provider==="instagram_business"){
              if(!approval.mediaUrl)throw new Error("Instagram requires a public image URL in the post request");
              let media;try{media=new URL(String(approval.mediaUrl));}catch{throw new Error("Instagram media URL is invalid");}if(media.protocol!=="https:"||["localhost","127.0.0.1","0.0.0.0"].includes(media.hostname))throw new Error("Instagram media URL must be a public HTTPS URL");
              const params=new URLSearchParams({image_url:media.toString(),caption:content,access_token:cfg.accessToken});
              const create=await fetch("https://graph.facebook.com/v24.0/"+encodeURIComponent(cfg.instagramUserId)+"/media",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:params});
              const cd=await create.json().catch(()=>({}));if(!create.ok||cd.error)throw new Error(cd.error?.message||("Instagram media creation failed: "+create.status));
              const publish=await fetch("https://graph.facebook.com/v24.0/"+encodeURIComponent(cfg.instagramUserId)+"/media_publish",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({creation_id:String(cd.id),access_token:cfg.accessToken})});
              const pd=await publish.json().catch(()=>({}));if(!publish.ok||pd.error)throw new Error(pd.error?.message||("Instagram publish failed: "+publish.status));
              return {provider,postId:pd.id,url:null};
