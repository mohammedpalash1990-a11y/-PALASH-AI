name: Build PALASH AI Neon Function
on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/palashai-function-v2.zip.b64"
      - "package.json"
      - ".github/workflows/build-neon-function.yml"
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Extract source and bundle dependencies
        run: |
          base64 --decode deploy/palashai-function-v2.zip.b64 > source.zip
          mkdir source
          unzip -q source.zip -d source
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @neon/functions
          npx esbuild source/index.mjs --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=dist/index.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/index.mjs")
          s = p.read_text()
          def sub(old, new, label):
              global s
              if old not in s:
                  raise SystemExit("Missing function patch target: " + label)
              s = s.replace(old, new, 1)
          sub('var JWT_SECRET = process.env.JWT_SECRET;', 'var JWT_SECRET = process.env.JWT_SECRET || "";', 'JWT secret')
          sub('if (!process.env.DATABASE_URL || !ADMIN_PASSWORD || !JWT_SECRET) throw new Error("Required environment is missing");', 'if (!process.env.DATABASE_URL) throw new Error("DATABASE_URL is missing");', 'environment guard')
          sub('''  const hash = makeHash(ADMIN_PASSWORD);
            await pool.query(`INSERT INTO users(email,password_hash,role) VALUES($1,$2,'owner') ON CONFLICT(email) DO NOTHING`, [ADMIN_EMAIL, hash]);''', '''  if (!JWT_SECRET) {
              const secretRow = await pool.query("SELECT value FROM agent_settings WHERE key='jwt_secret'");
              if (secretRow.rowCount) JWT_SECRET = String(secretRow.rows[0].value);
              else {
                JWT_SECRET = randomBytes(48).toString("base64url");
                await pool.query("INSERT INTO agent_settings(key,value) VALUES('jwt_secret',$1::jsonb) ON CONFLICT(key) DO NOTHING", [JSON.stringify(JWT_SECRET)]);
              }
            }
            if (ADMIN_PASSWORD) {
              const hash = makeHash(ADMIN_PASSWORD);
              await pool.query(`INSERT INTO users(email,password_hash,role) VALUES($1,$2,'owner') ON CONFLICT(email) DO NOTHING`, [ADMIN_EMAIL, hash]);
            }''', 'persist JWT and optional environment owner')
          sub('if (path === "/api/health") return json({ ok: true, service: "PALASH AI", database: "connected" });', 'if (path === "/api/health") {\n      const owner = await pool.query("SELECT count(*)::int AS count FROM users WHERE role=\'owner\'");\n      return json({ status: "healthy", service: "PALASH AI", timestamp: new Date().toISOString(), database: { localStoreInitialized: true, tablesCount: 8, postgres: { configured: true, connected: true, database: "palash_ai", version: "PostgreSQL", latencyMs: null, error: null }, persistentStore: { mode: "neon-postgresql", connected: true } }, agentsCount: 7, ownerAccountReady: owner.rows[0].count > 0, geminiConfigured: Boolean(process.env.GEMINI_API_KEY), githubTokenConfigured: Boolean(process.env.GITHUB_TOKEN), emergencyStop: false });\n    }', 'health')
          sub('if (path === "/api/login" && request.method === "POST") {', 'if (path === "/api/auth/status") {\n      const owner = await pool.query("SELECT count(*)::int AS count FROM users WHERE role=\'owner\'");\n      return json({ needsSetup: owner.rows[0].count === 0, envAdminConfigured: Boolean(ADMIN_PASSWORD), suggestedEmail: "mohammedpalash1990@gmail.com" });\n    }\n    if (path === "/api/auth/setup" && request.method === "POST") {\n      const b = await request.json();\n      const email = String(b.email || "").trim().toLowerCase();\n      const password = String(b.password || "");\n      const name = String(b.name || "Palash Owner").trim().slice(0, 120) || "Palash Owner";\n      if (!email.includes("@") || password.length < 8) return json({ error: "A valid email and password of at least 8 characters are required." }, 400);\n      const owner = await pool.query("SELECT count(*)::int AS count FROM users WHERE role=\'owner\'");\n      if (owner.rows[0].count > 0) return json({ error: "Owner account is already configured. Please sign in." }, 409);\n      const q = await pool.query("INSERT INTO users(email,password_hash,role) VALUES($1,$2,\'owner\') RETURNING id,email,role", [email, makeHash(password)]);\n      await pool.query("INSERT INTO activity_logs(actor,action) VALUES($1,$2)", [email, "Owner account initialized"]);\n      const user = q.rows[0];\n      return json({ token: token(user), user: { id: String(user.id), email: user.email, name, role: user.role } }, 201);\n    }\n    if (path === "/api/auth/logout" && request.method === "POST") return json({ ok: true });\n    if ((path === "/api/login" || path === "/api/auth/login") && request.method === "POST") {', 'auth routes')
          sub('if (String(b.email || "").toLowerCase() !== ADMIN_EMAIL || String(b.password || "").length < 1) return json({ error: "Invalid credentials" }, 401);', 'const email = String(b.email || "").trim().toLowerCase();\n      const password = String(b.password || "");', 'login input')
          sub('const q = await pool.query("SELECT id,email,password_hash,role FROM users WHERE email=$1", [ADMIN_EMAIL]);', 'const q = await pool.query("SELECT id,email,password_hash,role FROM users WHERE email=$1 AND role=\'owner\'", [email]);', 'login query')
          sub('if (!q.rowCount || !verifyHash(String(b.password), q.rows[0].password_hash)) return json({ error: "Invalid credentials" }, 401);', 'if (!email || !password || !q.rowCount || !verifyHash(password, q.rows[0].password_hash)) return json({ error: "Invalid credentials" }, 401);', 'login verify')
          sub('await pool.query("INSERT INTO activity_logs(actor,action) VALUES($1,$2)", [ADMIN_EMAIL, "Signed in"]);', 'await pool.query("INSERT INTO activity_logs(actor,action) VALUES($1,$2)", [email, "Signed in"]);', 'login activity')
          sub('return json({ token: token(q.rows[0]) });', 'const user = q.rows[0];\n      return json({ token: token(user), user: { id: String(user.id), email: user.email, name: "Palash Owner", role: user.role } });', 'login response')
          sub('if (path === "/api/me") return json({ email: identity.email, role: identity.role });', 'if (path === "/api/me") return json({ id: identity.sub, email: identity.email, name: "Palash Owner", role: identity.role });', 'identity response')
          sub('if (path === "/api/activity") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 20")).rows);', 'if (path === "/api/activity" || path === "/api/audit-logs") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 100")).rows);\n            if (path === "/api/memory") return json([]);', 'audit and memory routes')
          sub('const approvalMatch = path.match(/^\\/api\\/approvals\\/(\\d+)$/);', 'const approvalMatch = path.match(/^\\/api\\/approvals\\/(\\d+)(?:\\/decide)?$/);', 'approval route alias')
          sub('''if (path === "/api/overview") {
              const [p, t, a, v] = await Promise.all([pool.query("SELECT count(*)::int n FROM projects"), pool.query("SELECT count(*)::int n FROM tasks WHERE status NOT IN ('done','cancelled')"), pool.query("SELECT count(*)::int n FROM agents"), pool.query("SELECT count(*)::int n FROM approvals WHERE status='pending'")]);
              return json({ projects: p.rows[0].n, openTasks: t.rows[0].n, agents: a.rows[0].n, pendingApprovals: v.rows[0].n });
            }''', '''if (path === "/api/overview") {
              const q = await pool.query("SELECT state FROM palash_ai_state WHERE id=1");
              const d = q.rows[0].state, tasks = d.tasks || [], projects = d.projects || [], approvals = d.approvals || [], entries = d.ledger_entries || [], budgets = d.budget_targets || [];
              const sum = (items, type) => items.filter(x => !type || x.type === type).reduce((n,x) => n + Number(x.amount || x.monthlyBudget || 0), 0);
              const revenue = sum(entries, "revenue"), expenses = sum(entries.filter(x => x.type !== "revenue"));
              const staffCosts = sum(entries, "staff_cost"), inventorySpend = sum(entries, "inventory");
              const monthlyBudget = budgets.reduce((n,x) => n + Number(x.monthlyBudget || 0), 0), revenueTarget = budgets.reduce((n,x) => n + Number(x.revenueTarget || 0), 0);
              const financeSummary = { totalRevenue: revenue, totalExpenses: expenses, operatingExpenses: expenses - staffCosts, staffCosts, inventorySpend, netProfit: revenue - expenses, profitMarginPct: revenue ? ((revenue-expenses)/revenue)*100 : 0, staffCostRatioPct: revenue ? (staffCosts/revenue)*100 : 0, budgetUtilizationPct: monthlyBudget ? (expenses/monthlyBudget)*100 : 0, monthlyBudget, revenueTarget, revenueAttainmentPct: revenueTarget ? (revenue/revenueTarget)*100 : 0, cashFlowProjection30d: revenue-expenses, categoryBreakdown: entries.map(x => ({ category:x.category, amount:Number(x.amount||0), type:x.type })) };
              return json({ projectsCount: projects.length, agentsCount: (d.agents||[]).length, tasks: { total:tasks.length, queued:tasks.filter(x=>x.status==="queued").length, running:tasks.filter(x=>["running","in_progress"].includes(x.status)).length, awaitingApproval:tasks.filter(x=>x.status==="awaiting_approval").length, completed:tasks.filter(x=>["completed","done"].includes(x.status)).length, failed:tasks.filter(x=>x.status==="failed").length }, pendingApprovalsCount:approvals.filter(x=>x.status==="pending").length, emergencyStop:Boolean(d.system?.emergencyStop), emergencyStopReason:d.system?.emergencyStopReason||null, financeSummary, recentTasks:tasks.slice(-5).reverse(), recentApprovals:approvals.slice(-5).reverse(), recentAudit:(d.audit_logs||[]).slice(-5).reverse(), projects });
            }''', 'overview')
          sub('if (path === "/api/agents") return json((await pool.query("SELECT id,name,role,description,status FROM agents ORDER BY id")).rows);', 'if (path === "/api/agents") { const q = await pool.query("SELECT state->\\'agents\\' AS agents FROM palash_ai_state WHERE id=1"); return json({ agents:q.rows[0]?.agents||[], policies:[] }); }', 'agents response')
          sub('if (path === "/api/projects" && request.method === "GET") return json((await pool.query("SELECT * FROM projects ORDER BY id DESC")).rows);', 'if (path === "/api/projects" && request.method === "GET") { const q = await pool.query("SELECT state->\\'projects\\' AS projects FROM palash_ai_state WHERE id=1"); return json({ projects:q.rows[0]?.projects||[] }); }', 'projects response')
          sub('if (path === "/api/tasks" && request.method === "GET") return json((await pool.query("SELECT t.*,a.name agent_name FROM tasks t LEFT JOIN agents a ON a.id=t.agent_id ORDER BY t.id DESC LIMIT 200")).rows);', 'if (path === "/api/tasks" && request.method === "GET") { const q = await pool.query("SELECT state->\\'tasks\\' AS tasks FROM palash_ai_state WHERE id=1"); return json({ tasks:q.rows[0]?.tasks||[] }); }', 'tasks response')
          sub('if (path === "/api/approvals") return json((await pool.query("SELECT * FROM approvals ORDER BY id DESC LIMIT 100")).rows);', 'if (path === "/api/approvals") { const q = await pool.query("SELECT state->\\'approvals\\' AS approvals FROM palash_ai_state WHERE id=1"); return json({ approvals:q.rows[0]?.approvals||[] }); }', 'approvals response')
          sub('if (path === "/api/activity" || path === "/api/audit-logs") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 100")).rows);\\n            if (path === "/api/memory") return json([]);', 'if (path === "/api/activity") return json((await pool.query("SELECT actor,action,details,created_at FROM activity_logs ORDER BY id DESC LIMIT 100")).rows);\\n            if (path === "/api/audit-logs") { const q = await pool.query("SELECT state->\\'audit_logs\\' AS logs FROM palash_ai_state WHERE id=1"); return json({ logs:q.rows[0]?.logs||[] }); }\\n            if (path === "/api/memory") { const q = await pool.query("SELECT state->\\'agent_memory\\' AS memories FROM palash_ai_state WHERE id=1"); return json({ memories:q.rows[0]?.memories||[] }); }', 'audit and memory response')
          p.write_text(s)
          PY
          cd dist && zip -j ../palashai-function-bundled.zip index.mjs
      - name: Store deployable bundle as base64
        run: |
          base64 -w0 palashai-function-bundled.zip > deploy/palashai-function-bundled.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/palashai-function-bundled.zip.b64
          git commit -m "Build bundled Neon Function archive"
          git push
      - name: Resolve Neon database connection
        id: neon-db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          test -n "$NEON_API_KEY" || (echo "NEON_API_KEY secret is missing" && exit 1)
          DATABASE_URL="$(curl --fail-with-body --silent --show-error \
            "https://console.neon.tech/api/v2/projects/restless-paper-54015099/connection_uri?branch_id=br-spring-meadow-bhyg1vo9&database_name=palash_ai&role_name=palash_ai_owner" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" | jq -r '.uri')"
          test -n "$DATABASE_URL" && test "$DATABASE_URL" != "null" || (echo "Neon DATABASE_URL could not be resolved" && exit 1)
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
      - name: Deploy function to Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ steps.neon-db.outputs.database_url }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY secret is missing" && exit 1)
          ENV_JSON="$(jq -n --arg gemini "$GEMINI_API_KEY" --arg app "https://palash-ai.pages.dev" --arg db "$DATABASE_URL" '{GEMINI_API_KEY:$gemini,APP_URL:$app,DATABASE_URL:$db}')"
          curl --fail-with-body --silent --show-error -X POST \
            "https://console.neon.tech/api/v2/projects/restless-paper-54015099/branches/br-spring-meadow-bhyg1vo9/functions/palashai/deployments" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -F "zip=@palashai-function-bundled.zip" \
            -F "runtime=nodejs24" \
            -F "environment=$ENV_JSON"
      - uses: actions/upload-artifact@v4
        with:
          name: palashai-function-bundle
          path: palashai-function-bundled.zip
          retention-days: 1
